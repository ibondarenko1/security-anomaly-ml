name: Materialize public release

on:
  push:
    branches:
      - agent/open-source-release
    paths:
      - .github/workflows/materialize-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/open-source-release
          fetch-depth: 0

      - name: Download and expand audited release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/security-anomaly-release/tree
          curl -fL --retry 3 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-fc14-81fd-a23d-7fe32a28cc41/raw?se=2026-08-17T20%3A50%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=258c34cc-f639-526b-ab47-092916ddf8f1&skoid=fadb8e47-d3c7-4c79-a9c3-970d9af3b213&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T20%3A29%3A36Z&ske=2026-08-18T20%3A29%3A36Z&sks=b&skv=2026-02-06&sig=a3ZiJsXiv0Q%2BhCgJVCEL%2B7cS1fYOT0DyvVRDbLnr0TU%3D' -o /tmp/security-anomaly-release/release.tar.gz
          tar -xzf /tmp/security-anomaly-release/release.tar.gz -C /tmp/security-anomaly-release/tree
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/security-anomaly-release/tree/. .
          rm -f .github/workflows/materialize-release.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit materialized tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ievgen Bondarenko"
          git config user.email "ibondarenko@student.sierracollege.edu"
          git add -A
          git commit -m "Initial open-source release"
          git push origin HEAD:agent/open-source-release
